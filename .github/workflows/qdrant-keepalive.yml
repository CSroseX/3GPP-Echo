# Keeps the Qdrant Cloud free cluster from being suspended (after 1 week
# without use) and deleted (after 4 weeks): one real vector search every
# 3 days. No LLM, no Modal, no cost. Run it by hand from the Actions tab
# ("Run workflow") to check the cluster is healthy.
#
# Repository secrets: QDRANT_CLOUD_URL, QDRANT_CLOUD_API_KEY (same values as .env).
# Note: GitHub pauses scheduled workflows after 60 days without repository
# activity and emails the owner; re-enable it from the Actions tab.
name: qdrant-keepalive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One vector search against the 3gpp_specs collection
        env:
          QDRANT_URL: ${{ secrets.QDRANT_CLOUD_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_CLOUD_API_KEY }}
        run: |
          if [ -z "$QDRANT_URL" ] || [ -z "$QDRANT_API_KEY" ]; then
            echo "::error::Set the QDRANT_CLOUD_URL and QDRANT_CLOUD_API_KEY repository secrets"
            exit 1
          fi
          # A 384-dim query vector (BGE-small size); any vector counts as real use.
          python3 -c "import json; print(json.dumps({'query': [0.05] * 384, 'limit': 1, 'with_payload': ['spec_id', 'clause_id']}))" > body.json
          curl -sS --fail-with-body -X POST "${QDRANT_URL%/}/collections/3gpp_specs/points/query" \
            -H "api-key: $QDRANT_API_KEY" -H "Content-Type: application/json" -d @body.json > resp.json
          python3 -c "import json; pts = json.load(open('resp.json'))['result']['points']; assert pts, 'no points'; print('ok:', pts[0]['payload'], 'score', round(pts[0]['score'], 3))"
